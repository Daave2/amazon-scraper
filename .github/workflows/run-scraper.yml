name: Run Playwright Scraper

# Primary, backup and final safety-net scrapes use fixed UTC times.
# All scrape slots fall between 01:17 and 04:47 UK time throughout GMT/BST.
# The 05:30 UTC monitor verifies the combined store submissions.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'   # Primary: 01:17 GMT / 02:17 BST
    - cron: '37 2 * * *'   # Backup: 02:37 GMT / 03:37 BST
    - cron: '47 3 * * *'   # Final fallback: 03:47 GMT / 04:47 BST
    - cron: '30 5 * * *'   # Monitor: 05:30 GMT / 06:30 BST

env:
  PYTHON_VERSION: '3.11'

jobs:
  scrape-and-submit:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '30 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: overnight-scraper-${{ github.ref }}
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@v4

      - name: Log execution time
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC: $(date -u)"
          echo "UK: $(TZ=Europe/London date)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers and dependencies
        run: python -m playwright install --with-deps chromium

      - name: Build runtime config from Secrets
        env:
          FORM_URL: ${{ secrets.FORM_URL }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          OTP_SECRET_KEY: ${{ secrets.OTP_SECRET_KEY }}
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os

          config = {
              "debug": False,
              "form_url": os.environ["FORM_URL"],
              "login_url": os.environ["LOGIN_URL"],
              "secret_key": os.environ["SECRET_KEY"],
              "login_email": os.environ["LOGIN_EMAIL"],
              "login_password": os.environ["LOGIN_PASSWORD"],
              "otp_secret_key": os.environ["OTP_SECRET_KEY"],
              "chat_webhook_url": os.environ["CHAT_WEBHOOK_URL"],
              "max_concurrency": 55,
              "initial_concurrency": 30,
              "num_form_submitters": 2,
              "page_timeout_ms": 90000,
              "element_wait_timeout_ms": 20000,
              "auto_concurrency": {"enabled": True}
          }

          with open("config.json", "w", encoding="utf-8") as file:
              json.dump(config, file, indent=2)
          PY

      - name: Download auth state from previous run
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: run-scraper.yml
          name: auth-state
          path: .
          if_no_artifact_found: warn
          search_artifacts: true

      - name: Run scraper and automatically retry incomplete submissions
        run: python .github/scripts/run_with_retry.py

      - name: Write submission status for morning monitoring
        if: always()
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          names = set()
          path = 'output/submissions.jsonl'
          if os.path.exists(path):
              with open(path, encoding='utf-8') as file:
                  for line in file:
                      try:
                          record = json.loads(line)
                          if record.get('store'):
                              names.add(record['store'].strip())
                      except (ValueError, AttributeError):
                          continue

          os.makedirs('output', exist_ok=True)
          with open('output/scraper-status.json', 'w', encoding='utf-8') as file:
              json.dump({
                  'event': os.environ.get('TRIGGER_EVENT', ''),
                  'scheduled_cron': os.environ.get('TRIGGER_SCHEDULE', ''),
                  'uk_date': datetime.now(ZoneInfo('Europe/London')).date().isoformat(),
                  'submitted_stores': sorted(names)
              }, file, indent=2)
          print(f'Submission report: {len(names)} distinct stores')
          PY

      - name: Upload scraper output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output-${{ github.run_id }}
          path: |
            output/
            app.log
            state.json
          retention-days: 7

      - name: Upload scraper status for monitoring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-status-${{ github.run_id }}
          path: output/scraper-status.json
          retention-days: 7

      - name: Upload auth state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-state
          path: state.json
          retention-days: 7
          overwrite: true

  overnight-monitor:
    if: github.event_name == 'schedule' && github.event.schedule == '30 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify overnight submissions; alert Google Chat only on problems
        env:
          GH_TOKEN: ${{ github.token }}
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
        run: python .github/scripts/check_overnight.py
