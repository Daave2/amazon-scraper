name: Scraper dry run
run-name: Dry run with local form receiver
on:
  push:
    branches: [test/overnight-dry-run-20261125]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHON_VERSION: '3.11'
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Log execution time
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC: $(date -u)"
          echo "UK: $(TZ=Europe/London date)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers and dependencies
        run: python -m playwright install --with-deps chromium

      - name: Build runtime config from Secrets
        env:
          FORM_URL: http://127.0.0.1:8765/formResponse
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          SECRET_KEY: ""
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          OTP_SECRET_KEY: ${{ secrets.OTP_SECRET_KEY }}
          CHAT_WEBHOOK_URL: ""
        run: |
          python - <<'PY'
          import json
          import os

          config = {
              "debug": False,
              "form_url": os.environ["FORM_URL"],
              "login_url": os.environ["LOGIN_URL"],
              "secret_key": os.environ["SECRET_KEY"],
              "login_email": os.environ["LOGIN_EMAIL"],
              "login_password": os.environ["LOGIN_PASSWORD"],
              "otp_secret_key": os.environ["OTP_SECRET_KEY"],
              "chat_webhook_url": os.environ["CHAT_WEBHOOK_URL"],
              "max_concurrency": 55,
              "initial_concurrency": 30,
              "num_form_submitters": 2,
              "page_timeout_ms": 90000,
              "element_wait_timeout_ms": 20000,
              "auto_concurrency": {"enabled": True}
          }

          with open("config.json", "w", encoding="utf-8") as file:
              json.dump(config, file, indent=2)
          PY

      - name: Download auth state from previous run
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        shell: bash
        run: |
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=auth-state&per_page=100")
          candidate=$(jq -r --arg branch "main" --argjson repo "$REPOSITORY_ID" '
            [.artifacts[] | select(.name == "auth-state" and .expired == false
              and .workflow_run.head_repository_id == $repo and .workflow_run.head_branch == $branch)]
            | max_by(.created_at, .id) | select(. != null) | [.id, .workflow_run.id] | @tsv
          ' <<< "$artifacts")
          if [[ -z "$candidate" ]]; then
            echo "No saved session available. The scraper will log in."
            exit 0
          fi
          read -r artifact_id run_id <<< "$candidate"
          source_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
          if ! jq -e '.path == ".github/workflows/run-scraper.yml" and .conclusion == "success"
            and (.event == "schedule" or .event == "workflow_dispatch")' <<< "$source_run" >/dev/null; then
            echo "Latest saved session is not from a successful scraper run. The scraper will log in."
            exit 0
          fi
          temp_dir=$(mktemp -d)
          trap 'rm -rf -- "$temp_dir"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$temp_dir/state.zip"
          unzip -p "$temp_dir/state.zip" state.json > "$temp_dir/state.json"
          jq -e '(.cookies | type == "array" and length > 0)' "$temp_dir/state.json" >/dev/null
          mv "$temp_dir/state.json" state.json

      - name: Read live store pages with a local dummy form
        shell: bash
        run: |
          python .github/scripts/dummy_form.py &
          receiver=$!
          trap 'kill "$receiver" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ready >/dev/null
          status=0
          python .github/scripts/run_with_retry.py > "$RUNNER_TEMP/dry-run.log" 2>&1 || status=$?
          grep -E '^Expected stores:|^Attempt [0-9]+: exit code=|^Missing stores:|^All expected stores' "$RUNNER_TEMP/dry-run.log" >> "$GITHUB_STEP_SUMMARY" || true
          cat "$GITHUB_STEP_SUMMARY"
          exit "$status"
