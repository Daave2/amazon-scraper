name: Run Playwright Scraper
# Distinct run names let the daily gate exclude the morning monitor.
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Manual scraper' || github.event.schedule == '30 5 * * *' && 'Morning monitor' || 'Scheduled scraper' }}

# Like the original working configuration: one UTC schedule opportunity per hour.
# The gate checks the actual UK time, allowing full scrapes only 01:00–05:29.
# At most the first two eligible scheduled runs per UK day scrape.
# Extra scheduled runs are lightweight; manual runs remain unrestricted.
# A separate 05:30 UTC schedule checks completed scraper jobs.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'    # Hourly scheduler check (same as original setup)
    - cron: '30 5 * * *'    # Monitor: 05:30 GMT / 06:30 BST

env:
  PYTHON_VERSION: '3.11'

jobs:
  scrape-gate:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '30 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_scrape: ${{ steps.check.outputs.run_scrape }}
    steps:
      - uses: actions/checkout@v4
      - name: Check UK overnight time and cap full scrapes at two per UK day
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/limit_daily_scrapes.py

  scrape-and-submit:
    needs: scrape-gate
    if: needs.scrape-gate.outputs.run_scrape == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: overnight-scraper-${{ github.ref }}
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@v4

      - name: Log execution time
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC: $(date -u)"
          echo "UK: $(TZ=Europe/London date)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers and dependencies
        run: python -m playwright install --with-deps chromium

      - name: Build runtime config from Secrets
        env:
          FORM_URL: ${{ secrets.FORM_URL }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          OTP_SECRET_KEY: ${{ secrets.OTP_SECRET_KEY }}
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os

          config = {
              "debug": False,
              "form_url": os.environ["FORM_URL"],
              "login_url": os.environ["LOGIN_URL"],
              "secret_key": os.environ["SECRET_KEY"],
              "login_email": os.environ["LOGIN_EMAIL"],
              "login_password": os.environ["LOGIN_PASSWORD"],
              "otp_secret_key": os.environ["OTP_SECRET_KEY"],
              "chat_webhook_url": os.environ["CHAT_WEBHOOK_URL"],
              "max_concurrency": 55,
              "initial_concurrency": 30,
              "num_form_submitters": 2,
              "page_timeout_ms": 90000,
              "element_wait_timeout_ms": 20000,
              "auto_concurrency": {"enabled": True}
          }

          with open("config.json", "w", encoding="utf-8") as file:
              json.dump(config, file, indent=2)
          PY

      - name: Download auth state from previous run
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        shell: bash
        run: |
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=auth-state&per_page=100")
          candidate=$(jq -r --arg branch "$GITHUB_REF_NAME" --argjson repo "$REPOSITORY_ID" '
            [.artifacts[] | select(.name == "auth-state" and .expired == false
              and .workflow_run.head_repository_id == $repo and .workflow_run.head_branch == $branch)]
            | max_by(.created_at, .id) | select(. != null) | [.id, .workflow_run.id] | @tsv
          ' <<< "$artifacts")
          if [[ -z "$candidate" ]]; then
            echo "No saved session available. The scraper will log in."
            exit 0
          fi
          read -r artifact_id run_id <<< "$candidate"
          source_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
          if ! jq -e '.path == ".github/workflows/run-scraper.yml" and .conclusion == "success"
            and (.event == "schedule" or .event == "workflow_dispatch")' <<< "$source_run" >/dev/null; then
            echo "Latest saved session is not from a successful scraper run. The scraper will log in."
            exit 0
          fi
          temp_dir=$(mktemp -d)
          trap 'rm -rf -- "$temp_dir"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$temp_dir/state.zip"
          unzip -p "$temp_dir/state.zip" state.json > "$temp_dir/state.json"
          jq -e '(.cookies | type == "array" and length > 0)' "$temp_dir/state.json" >/dev/null
          mv "$temp_dir/state.json" state.json

      - name: Run scraper and automatically retry incomplete submissions
        run: python .github/scripts/run_with_retry.py

      - name: Write submission status for morning monitoring
        if: always()
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          names = set()
          path = 'output/submissions.jsonl'
          if os.path.exists(path):
              with open(path, encoding='utf-8') as file:
                  for line in file:
                      try:
                          record = json.loads(line)
                          if record.get('store'):
                              names.add(record['store'].strip())
                      except (ValueError, AttributeError):
                          continue

          os.makedirs('output', exist_ok=True)
          with open('output/scraper-status.json', 'w', encoding='utf-8') as file:
              json.dump({
                  'event': os.environ.get('TRIGGER_EVENT', ''),
                  'scheduled_cron': os.environ.get('TRIGGER_SCHEDULE', ''),
                  'uk_date': datetime.now(ZoneInfo('Europe/London')).date().isoformat(),
                  'submitted_stores': sorted(names)
              }, file, indent=2)
          print(f'Submission report: {len(names)} distinct stores')
          PY

      - name: Upload scraper output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output-${{ github.run_id }}
          path: |
            output/
            app.log
            state.json
          retention-days: 7

      - name: Upload scraper status for monitoring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-status-${{ github.run_id }}
          path: output/scraper-status.json
          retention-days: 7

      - name: Upload auth state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-state
          path: state.json
          retention-days: 7
          overwrite: true

  overnight-monitor:
    if: github.event_name == 'schedule' && github.event.schedule == '30 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify overnight submissions; alert Google Chat only on problems
        env:
          GH_TOKEN: ${{ github.token }}
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
        run: python .github/scripts/check_overnight.py
