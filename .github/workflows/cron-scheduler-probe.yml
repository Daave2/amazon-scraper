name: Temporary GitHub Scheduler Probe

# Diagnostic only, no scraper or secrets.
# Scheduled several times on 10 Nov 2026, 09:05-09:35 GMT.
# Remove this workflow after interpreting the test results.
on:
  workflow_dispatch:
  schedule:
    - cron: '5,10,15,20,25,30,35 9 10 11 *'

permissions:
  contents: read

jobs:
  cron-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record GitHub trigger and execution time
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Scheduled expression: ${{ github.event.schedule }}"
          echo "Current UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "The scheduler successfully created this workflow run."
